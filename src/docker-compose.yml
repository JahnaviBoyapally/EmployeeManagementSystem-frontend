
services:
  mysql:
    image: mysql:8.4
    container_name: employee-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: employee_management
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3305:3306"
    volumes:
      - employee_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -p${DB_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend/employee-management
    container_name: employee-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/employee_management
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: employee-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  employee_mysql_data:
